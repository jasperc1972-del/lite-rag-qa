# pytest 設定
[pytest]
# 預設測試資料夾，直接執行 pytest 即可
testpaths = tests
# 參數化測試的名稱直接顯示中文（預設會轉成 報 這類跳脫碼）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
# 平常只跑快速、免費的單元測試；回歸測試要手動加 -m eval 或 -m llm
addopts = -m "not eval and not llm"
markers =
    eval: 評估題庫的檢索回歸測試（免費，需載入 Embedding 模型，約 30 秒）
    llm: 呼叫 Claude API 的回歸測試（會產生費用）
